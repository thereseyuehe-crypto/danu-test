<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F2E8">
<title>你拿的是哪一版大女主剧本</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
--paper:#F7F2E8;--paper2:#EDE5D6;--ink:#1C1A17;--ink2:#5A5348;--ink3:#8C8478;
--red:#9E2B25;--red2:#C0483C;--gold:#A8864E;--line:rgba(28,26,23,.14);--ok:#3B6D11;
}
html,body{background:#DCD3C2;color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
-webkit-text-size-adjust:100%}
#app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--paper);
padding-bottom:env(safe-area-inset-bottom);box-shadow:0 0 0 1px var(--line)}
.page{padding:26px 20px 40px}
.hidden{display:none!important}
.center{text-align:center}

/* 密码 */
.lock{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:34px 26px}
.lock .mark{width:52px;height:52px;border:1px solid var(--gold);border-radius:50%;
display:flex;align-items:center;justify-content:center;font-size:20px;color:var(--gold);margin-bottom:20px}
.lock h1{font-size:23px;font-weight:600;letter-spacing:.03em;text-align:center}
.lock .tip{font-size:13px;color:var(--ink3);margin-top:12px;text-align:center;line-height:1.8}
.lock input{width:100%;max-width:320px;margin-top:32px;padding:15px 16px;text-align:center;
font-family:inherit;font-size:17px;letter-spacing:.24em;border:1px solid var(--line);
border-radius:3px;background:#fff;color:var(--ink);outline:none}
.lock input:focus{border-color:var(--gold)}
.lock input.err{border-color:var(--red2);animation:shake .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.lock .msg{font-size:13px;color:var(--red);height:20px;margin-top:12px;text-align:center}
.lock .left{font-size:13px;color:var(--ink3);margin-top:6px;min-height:20px}
.lock .warn{margin-top:26px;max-width:320px;font-size:11px;line-height:1.85;color:var(--ink3);
border-top:1px solid var(--line);padding-top:18px;text-align:left}

/* 封面 */
.cover{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:44px 26px}
.cover .kicker{font-size:11px;letter-spacing:.34em;color:var(--gold);margin-bottom:20px}
.cover h1{font-size:30px;line-height:1.36;font-weight:600}
.cover h1 em{font-style:normal;color:var(--red)}
.cover .rule{width:32px;height:1px;background:var(--gold);margin:24px auto}
.cover .sub{font-size:14px;line-height:1.95;color:var(--ink2);max-width:310px}
.cover .meta{font-size:12px;color:var(--ink3);line-height:2.1;margin-top:26px}
.btn{display:block;width:100%;max-width:300px;margin:26px auto 0;padding:16px 20px;
background:var(--red);color:#F7F2E8;border:none;border-radius:2px;
font-size:15px;letter-spacing:.14em;font-family:inherit;cursor:pointer}
.btn:active{background:var(--red2)}
.btn:disabled{background:#CFC5B2;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--red);border:1px solid var(--red);margin-top:12px}
.btn.dark{background:var(--ink);color:var(--paper)}

/* 答题 */
.qhead{display:flex;justify-content:space-between;font-size:11px;color:var(--ink3);letter-spacing:.1em;margin-bottom:8px}
.pbar{height:2px;background:var(--paper2);margin-bottom:32px}
.pbar i{display:block;height:100%;background:var(--red);transition:width .3s}
.qtitle{font-size:21px;line-height:1.6;font-weight:500;margin-bottom:9px}
.qhint{font-size:12px;color:var(--ink3);margin-bottom:26px}
.opt{display:block;width:100%;text-align:left;padding:15px 16px;margin-bottom:10px;
background:rgba(255,255,255,.6);border:1px solid var(--line);border-radius:3px;
font-family:inherit;font-size:15px;line-height:1.55;color:var(--ink);cursor:pointer}
.opt:active{background:#fff;border-color:var(--gold)}
.opt.sel{background:rgba(158,43,37,.06);border-color:var(--red)}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:24px;min-height:36px}
.qfoot button{background:none;border:none;font-family:inherit;font-size:13px;color:var(--ink3);cursor:pointer;padding:8px 0}
.qfoot .lockbtn{color:var(--red);font-size:14px;letter-spacing:.1em}

/* 结果 */
.hero{text-align:center;padding:10px 0 24px}
.hero .kicker{font-size:11px;letter-spacing:.3em;color:var(--gold);margin-bottom:16px}
.hero .type{font-size:32px;font-weight:600;letter-spacing:.03em;line-height:1.25}
.hero .title{font-size:15px;color:var(--red);margin-top:10px;letter-spacing:.06em}
.hero .line{margin-top:22px;font-size:16px;line-height:1.8;font-weight:500}
.badges{display:flex;justify-content:center;gap:7px;margin-top:20px;flex-wrap:wrap}
.badge{font-size:12px;padding:5px 11px;border:1px solid var(--line);border-radius:2px;color:var(--ink2);background:rgba(255,255,255,.6)}
.badge.hl{border-color:var(--red);color:var(--red)}
.divider{height:1px;background:var(--line);margin:32px 0}
.sec{margin-bottom:32px}
.sec h3{font-size:12px;letter-spacing:.2em;color:var(--gold);margin-bottom:14px;font-weight:500}
.sec p{font-size:15px;line-height:1.95;margin-bottom:14px}
.sec p em{font-style:normal;color:var(--red);border-bottom:1px solid rgba(158,43,37,.3)}
.quote{border-left:2px solid var(--red);padding:2px 0 2px 15px;font-size:15px;line-height:1.85}
.stages{display:flex;flex-direction:column;gap:9px}
.stage{padding:14px 15px;border:1px solid var(--line);border-radius:3px;background:rgba(255,255,255,.5)}
.stage.on{border-color:var(--red);background:rgba(158,43,37,.05)}
.stage h4{font-size:14px;font-weight:500;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center}
.stage h4 em{font-style:normal;font-size:11px;color:var(--red)}
.stage p{font-size:13px;line-height:1.85;color:var(--ink2);margin:0}
.acc{border:1px solid var(--line);border-radius:3px;overflow:hidden}
.acc summary{padding:14px 15px;font-size:13px;cursor:pointer;list-style:none;background:rgba(255,255,255,.5);color:var(--ink2)}
.acc summary::-webkit-details-marker{display:none}
.acc summary:after{content:"＋";float:right;color:var(--gold)}
.acc[open] summary:after{content:"－"}
.acc .body{padding:2px 15px 15px}
.acc li{font-size:13px;line-height:1.9;color:var(--ink2);margin-bottom:6px;list-style:none}
.acc li.disc{color:var(--red)}
#shot{width:100%;border:1px solid var(--line);display:block;background:#F7F2E8}
.acts{display:flex;flex-direction:column;gap:10px;margin-top:26px}
.acts button,.acts a{width:100%;padding:15px;border-radius:2px;font-family:inherit;font-size:15px;
cursor:pointer;text-align:center;text-decoration:none;display:block;letter-spacing:.06em}
.primary{background:var(--red);color:#F7F2E8;border:none}
.secondary{background:transparent;color:var(--red);border:1px solid var(--red)}
.grid8{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.g8item{padding:12px;border:1px solid var(--line);border-radius:3px;background:rgba(255,255,255,.5)}
.g8item.on{border-color:var(--red);background:rgba(158,43,37,.06)}
.g8item b{display:block;font-size:14px;font-weight:500;margin-bottom:4px}
.g8item span{font-size:12px;color:var(--ink3)}
.foot{margin-top:40px;text-align:center;font-size:11px;color:var(--ink3);line-height:1.9}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(28,26,23,.55);display:flex;align-items:center;
justify-content:center;padding:24px;z-index:99}
.modal{background:var(--paper);border-radius:6px;padding:28px 24px 22px;max-width:340px;width:100%;
text-align:center;max-height:86vh;overflow:auto}
.modal h4{font-size:18px;font-weight:600;margin-bottom:14px}
.modal .mp{font-size:14px;line-height:1.95;color:var(--ink2);margin-bottom:22px;text-align:left}
.modal .mp b{color:var(--red);font-weight:500}
.modal .row{display:flex;gap:10px}
.modal .row>*{flex:1;margin:0}
.toast{position:fixed;left:50%;bottom:56px;transform:translateX(-50%);background:rgba(28,26,23,.92);
color:#F7F2E8;font-size:13px;padding:11px 20px;border-radius:3px;z-index:200;opacity:0;
transition:opacity .25s;pointer-events:none;max-width:82%;text-align:center;line-height:1.6}
.toast.on{opacity:1}
</style>
</head>

   - 本地模式：passwords.js 哈希 + localStorage 计数（仅本浏览器有效）
   =================================================================== */
function fnv(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=(h*0x01000193)>>>0;}h^=s.length;h=(h*0x01000193)>>>0;h^=0x9e3779b9;h=(h*0x01000193)>>>0;h^=h>>>15;h=(h*0x2545f491)>>>0;return h>>>0;}

/* ---------- Supabase 轻量客户端（无依赖，只用 RPC 接口） ---------- */
const SB = (function(){
  const cfg = (typeof window.SUPABASE_CONFIG==='object' && window.SUPABASE_CONFIG) || {};
  if(!cfg.url || !cfg.anonKey) return null;
  const base = cfg.url.replace(/\/+$/,'');
  const headers = {
    'apikey': cfg.anonKey,
    'Authorization': 'Bearer ' + cfg.anonKey,
    'Content-Type': 'application/json'
  };
  async function rpc(fn, body){
    const r = await fetch(base + '/rest/v1/rpc/' + fn, {
      method:'POST', headers: headers,
      body: JSON.stringify(body||{})
    });
    if(!r.ok){
      const t = await r.text().catch(()=> '');
      throw new Error('SUPA ' + r.status + ' ' + t.slice(0,200));
    }
    return r.json();
  }
  return { rpc };
})();

const PWD_LIST  = (typeof window.PWD_HASH === 'object' && window.PWD_HASH) ? window.PWD_HASH : null;
const PMAP      = (typeof window.PWD_MAP === 'object' && window.PWD_MAP) ? window.PWD_MAP : {};
const MAX_TIMES = (typeof window.PWD_MAX === 'number' && window.PWD_MAX > 0) ? window.PWD_MAX : 3;
const PWDSET = new Set(Array.isArray(PWD_LIST) ? PWD_LIST : []);

if(SB){

const KEYS=['A','B','C','D','E','F','G','H'];
const MAXS={A:20,B:18,C:20,D:14,E:18,F:16,G:17,H:19};

/* ===================================================================
   ④ 计分
   =================================================================== */
function score(ans){
 const s={A:0,B:0,C:0,D:0,E:0,F:0,G:0,H:0};
 // 隐藏型需要两个条件同时成立：末题选「不知道自己想要什么」 + 周末题选「一个人去看展」
 const hid=(ans[17]===0)&&(ans[14]===3);
 ans.forEach((ai,i)=>{const o=QUESTIONS[i].o[ai]; o.s.forEach(k=>s[k]++);});
 if(hid) return {key:'Z',s:s,top:'Z',margin:0,ratio:1,rare:2};
 const o=KEYS.slice().sort((x,y)=>s[y]-s[x]);
 const top=o[0],margin=s[top]-s[o[1]],ratio=s[top]/MAXS[top];
 const rare=Math.max(2,Math.min(48,Math.round(46-margin*4.6-(ratio>0.62?6:0))));
 return {key:top,s:s,top:top,margin:margin,ratio:ratio,rare:rare};
}
const stageOf=r=>(r<0.34?0:r<0.58?1:2);

/* ---------- 密码 ---------- */
function usedCount(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'{}')}catch(e){return{}}}
function usedOf(p){return usedCount()[p]||0}
function markUse(p){const o=usedCount();o[p]=(o[p]||0)+1;try{localStorage.setItem(STORE_KEY,JSON.stringify(o))}catch(e){}}

function lockScreen(msg,left,locked,lim){
 lim = lim || MAX_TIMES;
 SC.innerHTML=`<div class="lock">
  <div class="mark">测</div>
  <h1>请输入访问密码</h1>
  <p class="tip">本测评每个密码限 ${lim} 次使用</p>
  <input id="pwd" type="text" inputmode="text" autocomplete="off" placeholder="输入密码" ${locked?'disabled':''} autocapitalize="characters" spellcheck="false">
  <div class="msg">${msg||''}</div>
  <div class="left">${left!=null?('剩余可用次数：'+Math.max(0,lim-left)):''}</div>
  <button class="btn" id="go" ${locked?'disabled':''}>开 始</button>
  <div class="warn">提示：${SB?'次数由云端数据库统一记录，换设备、开无痕也刷不掉':'访问次数按浏览器本地记录。若在无痕模式或更换设备后重置，说明这是前端校验，无法阻止技术手段的绕过——仅用于控制正常用户的转发扩散'}。</div>
 </div>`;
 const inp=document.getElementById('pwd');
 setTimeout(()=>inp&&inp.focus(),100);
 inp&&inp.addEventListener('keydown',e=>{if(e.key==='Enter')check()});
 document.getElementById('go').onclick=check;
 let busy=false;
 function check(){
  const v=inp.value.trim(); if(!v||busy)return;
  const pw=v.toUpperCase();
  if(SB){ checkCloud(pw); return; }
  /* ---- 本地模式 ---- */
  if(!PWDSET.size){
    return lockScreen('密码表未加载：请配置 config.js（云端）或放置 passwords.js 后刷新',null,true);
  }
  const h=fnv(pw);
  if(!PWDSET.has(h)){
    inp.classList.add('err');setTimeout(()=>inp.classList.remove('err'),350);
    return lockScreen('密码不对',null,false);
  }
  const my=PMAP[h]||lim;
  const c=usedOf(pw);
  if(c>=my){return lockScreen('该密码使用次数已用完',0,true,my);}
  markUse(pw); cover();
 }
 /* ---- 云端模式：Supabase RPC 校验 + 原子扣次 ---- */
 async function checkCloud(pw){
  const btn=document.getElementById('go');
  busy=true;
  if(btn){btn.disabled=true;btn.textContent='验证中…';}
  try{
    const r = await SB.rpc('verify_password', { p_pwd: pw, p_ip: '' });
    // 返回 {ok, enter, left, max, throttled?}
    const o = Array.isArray(r) ? r[0] : r;
    if(o && o.throttled){
      return lockScreen('尝试过于频繁，请几分钟后再试',null,false);
    }
    if(!o || !o.ok){
      inp.classList.add('err');setTimeout(()=>inp.classList.remove('err'),350);
      return lockScreen('密码不对',null,false);
    }
    if(!o.enter){
      return lockScreen('该密码使用次数已用完',0,true,o.max||3);
    }
    markUse(pw); cover();
  }catch(e){
    console.error('[密码] 云端校验失败', e);
    // 云端故障时回落本地表（若可用），否则提示
    if(PWDSET.size){
      const h=fnv(pw);
      if(PWDSET.has(h)){
        const my=PMAP[h]||lim;
        const c=usedOf(pw);
        if(c<my){ markUse(pw); return cover(); }
        return lockScreen('该密码使用次数已用完',0,true,my);
      }
      inp.classList.add('err');setTimeout(()=>inp.classList.remove('err'),350);
      return lockScreen('密码不对（云端暂不可用，已用本地校验）',null,false);
    }
    return lockScreen('云端校验失败：'+e.message.slice(0,80),null,false);
  }finally{
    busy=false;
  }
 }
}

/* ---------- 封面 ---------- */
function cover(){
 SC.innerHTML=`<div class="cover">
  <div class="kicker">大 女 主 剧 本 鉴</div>
  <h1>你拿的是<br><em>哪一版大女主剧本</em></h1>
  <div class="rule"></div>
  <p class="sub">18 道题，8 种剧本，外加一个很少有人能解锁的第 9 种。<br>不比别人，只比你自己写过的那一版。</p>
  <button class="btn" onclick="start()">开 始 测 试</button>
  <div class="meta">18 题 · 5 个维度 · 9 种结局<br>大约 90 秒</div>
 </div>`;
}
function start(){cur=0;ans=[];render();}

/* ---------- 答题 ---------- */
function render(){
 const q=QUESTIONS[cur],pct=(cur/QUESTIONS.length*100).toFixed(1);
 SC.innerHTML=`<div class="page">
  <div class="qhead"><span>${q.d}</span><span>${cur+1} / ${QUESTIONS.length}</span></div>
  <div class="pbar"><i style="width:${pct}%"></i></div>
  <h2 class="qtitle">${q.q}</h2><p class="qhint">${q.h}</p>
  ${q.o.map((o,i)=>`<button class="opt${ans[cur]===i?' sel':''}" onclick="pick(${i})">${o.t}</button>`).join('')}
  <div class="qfoot">
   <button onclick="back()">${cur===0?'退出':'上一题'}</button>
   ${ans.length>cur?`<button class="lockbtn" onclick="next()">${cur===QUESTIONS.length-1?'看结果':'下一题'}</button>`:'<span></span>'}
  </div></div>`;
 window.scrollTo(0,0);
}
function pick(i){ans[cur]=i;render();}
function next(){ if(cur===QUESTIONS.length-1){res=score(ans);result();return;} cur++;render(); }
function back(){ if(cur===0){cover();return;} cur--;render(); }

/* ---------- 结果 ---------- */
function result(){
 const T=TYPES[res.key],g=stageOf(res.ratio),isZ=res.key==='Z';
 let grid='';
 if(isZ) grid=`<p style="font-size:13px;color:var(--ink2)">你解锁了第 9 种。它的触发条件不是分数，而是你在最后一题的选择。</p>`;
 else{
  const order=KEYS.slice().sort((x,y)=>res.s[y]-res.s[x]);
  grid=`<p style="font-size:13px;color:var(--ink2);margin-bottom:12px">你的分数分布——得分最高的一栏就是你的剧本。</p><div class="grid8">`+
   order.map(k=>`<div class="g8item${k===res.top?' on':''}"><b>${TYPES[k].k}</b><span>${res.s[k]} / ${MAXS[k]}</span></div>`).join('')+`</div>`;
 }
 SC.innerHTML=`<div class="page">
 <div class="hero">
  <div class="kicker">${isZ?'H I D D E N　·　解 锁':'你 的 剧 本'}</div>
  <div class="type">${T.k}</div><div class="title">${T.t}</div>
  <div class="line">${T.l}</div>
  <div class="badges"><span class="badge hl">${T.st[g].n.split(' · ')[1]}</span>
  <span class="badge">稀有度 前 ${res.rare}%</span>
  <span class="badge">${isZ?'隐藏结果':'主导型 '+res.top}</span></div>
 </div>
 <div class="divider"></div>
 ${T.unlock?`<div class="sec"><h3>解 锁 条 件</h3><div class="quote">${T.unlock}</div></div>`:''}
 <div class="sec"><h3>你 在 剧 本 里 怎 么 活</h3>${T.body.map(x=>`<p>${x}</p>`).join('')}</div>
 <div class="sec"><h3>你 的 盲 区</h3>${T.blind.map(x=>`<p>${x}</p>`).join('')}</div>
 <div class="sec"><h3>你 带 走 的 东 西</h3><div class="quote">${T.learn[0]}</div><p style="margin-top:14px">${T.learn[1]}</p></div>
 <div class="divider"></div>
 <div class="sec"><h3>三 个 阶 段 · 你 在 第 几 段</h3><div class="stages">
  ${T.st.map((s,i)=>`<div class="stage${i===g?' on':''}"><h4>${s.n}${i===g?'<em>你在这</em>':''}</h4><p>${s.d}</p></div>`).join('')}
 </div></div>
 <div class="sec"><h3>结 果 长 图</h3><img id="shot" alt="结果长图">
  <div class="acts">
   <button class="primary" onclick="saveShot()">保存 / 转发长图</button>
   <button class="secondary" onclick="copyLink()">复制结果链接</button>
   <button class="secondary" onclick="start()">再测一次</button>
   <button class="secondary" onclick="goodReview()">好评有礼</button>
  </div>
 </div>
 <div class="sec"><h3>理 论 出 处</h3>
  <details class="acc"><summary>这套结果是怎么算出来的</summary><div class="body"><ul>
  ${T.th.map(t=>`<li>· ${t}</li>`).join('')}<li class="disc">· 稀有度与阶段为趣味化呈现，非临床测评结果</li></ul></div></details>
 </div>
 <div class="sec"><h3>八 种 剧 本 都 长 什 么 样</h3>${grid}</div>
 <div class="foot">本测评基于自我决定理论、依恋理论、叙事身份理论等公开研究构建<br>仅供自我参照，不构成心理诊断</div>
 </div>`;
 window.scrollTo(0,0);
 buildShot(T,g);
 window._shotUrl=null;
}

/* ---------- 分享链接 ---------- */
function encodeAns(){
 let s=''; ans.forEach((a,i)=>s+=String.fromCharCode(48+a));
 return btoa(s).replace(/=+$/,'');
}
function shareURL(){
 const u=new URL(location.href); u.hash='r='+encodeAns(); return u.toString();
}
function copyLink(){
 const u=shareURL();
 const done=()=>toast('链接已复制，发给朋友就能看到你的结果');
 if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(u).then(done).catch(()=>fallback());}
 else fallback();
 function fallback(){
  const i=document.createElement('textarea');i.value=u;
  i.style.cssText='position:fixed;top:-999px';document.body.appendChild(i);i.select();
  try{document.execCommand('copy');done();}catch(e){toast('复制失败，请手动复制地址栏');}
  document.body.removeChild(i);
 }
}

/* ---------- 好评弹窗 ---------- */
function goodReview(){
 MR.innerHTML=`<div class="mask" onclick="if(event.target===this)closeModal()">
  <div class="modal">
   <h4>好评有礼</h4>
   <p class="mp">店铺好评后，请联系客服并发送好评截图，即可获得 <b>1 元返现</b>。</p>
   <div class="row"><button class="secondary" onclick="closeModal()">知道了</button></div>
  </div></div>`;
}
function closeModal(){MR.innerHTML=''}

/* ---------- 长图 ---------- */
function saveShot(){
 if(!window._shotUrl){toast('图片还在生成，请稍等一下');return;}
 const a=document.createElement('a');
 a.href=window._shotUrl; a.download='大女主剧本-'+TYPES[res.key].k.replace(/[·\s]/g,'')+'.png';
 document.body.appendChild(a); a.click(); document.body.removeChild(a);
 toast(isIOS()?'长按上方图片可保存到相册':'已保存，可直接分享');
}
function isIOS(){return /iPhone|iPad|iPod/i.test(navigator.userAgent)}

function buildShot(T,g){
 const W=1080,H=1560,S=2;
 const c=document.createElement('canvas');c.width=W*S;c.height=H*S;
 const x=c.getContext('2d');x.scale(S,S);
 x.fillStyle='#F7F2E8';x.fillRect(0,0,W,H);
 x.strokeStyle='rgba(28,26,23,.16)';x.lineWidth=2;x.strokeRect(34,34,W-68,H-68);
 x.strokeStyle='rgba(168,134,78,.42)';x.lineWidth=1;x.strokeRect(46,46,W-92,H-92);

 x.textAlign='center';
 x.fillStyle='#A8864E';x.font='300 21px "PingFang SC",sans-serif';
 x.letterSpacing='10px';x.fillText('大 女 主 剧 本 鉴',W/2,126);x.letterSpacing='0px';
 x.strokeStyle='#A8864E';x.beginPath();x.moveTo(W/2-38,160);x.lineTo(W/2+38,160);x.stroke();

 x.fillStyle='#1C1A17';x.font='600 66px "PingFang SC",sans-serif';
 x.fillText(T.k.split('·')[0].trim(),W/2,262);
 x.fillStyle='#9E2B25';x.font='400 29px "PingFang SC",sans-serif';
 x.fillText(T.t,W/2,322);

 x.fillStyle='rgba(28,26,23,.07)';x.fillRect(118,376,W-236,2);

 x.fillStyle='#1C1A17';x.font='500 33px "PingFang SC",sans-serif';
 wrap(x,T.l,W/2,452,850,50);

 x.fillStyle='#5A5348';x.font='400 23px "PingFang SC",sans-serif';
 wrap(x,T.blind[0],W/2,650,770,40);

 x.fillStyle='rgba(158,43,37,.07)';rr(x,W/2-340,838,680,92,4);x.fill();
 x.strokeStyle='rgba(158,43,37,.32)';x.lineWidth=1;rr(x,W/2-340,838,680,92,4);x.stroke();
 x.fillStyle='#9E2B25';x.font='500 25px "PingFang SC",sans-serif';
 x.fillText(T.st[g].n,W/2,890);

 x.fillStyle='#5A5348';x.font='400 23px "PingFang SC",sans-serif';
 x.fillText('稀有度 前 '+res.rare+'%　·　18 题 / 5 维度',W/2,984);

 if(res.key==='Z'){
  x.fillStyle='rgba(158,43,37,.05)';rr(x,180,1042,720,92,4);x.fill();
  x.strokeStyle='rgba(158,43,37,.3)';rr(x,180,1042,720,92,4);x.stroke();
  x.fillStyle='#9E2B25';x.font='500 26px "PingFang SC",sans-serif';
  x.fillText('隐藏结果 · 第 9 种剧本',W/2,1098);
 }else{
  const order=KEYS.slice().sort((a,b)=>res.s[b]-res.s[a]);
  const cw=196,ch=76,gx=20,gy=16;
  const sx=(W-(4*cw+3*gx))/2,sy=1044;
  order.forEach((k,i)=>{
   const r=Math.floor(i/4),cx=i%4,bx=sx+cx*(cw+gx),by=sy+r*(ch+gy),on=k===res.top;
   x.fillStyle=on?'rgba(158,43,37,.08)':'rgba(255,255,255,.55)';rr(x,bx,by,cw,ch,3);x.fill();
   x.strokeStyle=on?'rgba(158,43,37,.38)':'rgba(28,26,23,.11)';x.lineWidth=1;rr(x,bx,by,cw,ch,3);x.stroke();
   x.fillStyle=on?'#9E2B25':'#1C1A17';x.font='500 23px "PingFang SC",sans-serif';
   x.fillText(TYPES[k].k.split('·')[0].trim(),bx+cw/2,by+34);
   x.fillStyle='#8C8478';x.font='400 19px "PingFang SC",sans-serif';
   x.fillText(res.s[k]+' / '+MAXS[k],bx+cw/2,by+59);
  });
 }
 x.fillStyle='#8C8478';x.font='400 20px "PingFang SC",sans-serif';
 x.fillText('你的剧本，由你执笔',W/2,1444);

 const url=c.toDataURL('image/png');
 const img=document.getElementById('shot'); if(img)img.src=url;
 window._shotUrl=url;
}
function rr(x,px,py,w,h,r){x.beginPath();x.moveTo(px+r,py);x.arcTo(px+w,py,px+w,py+h,r);x.arcTo(px+w,py+h,px,py+h,r);x.arcTo(px,py+h,px,py,r);x.arcTo(px,py,px+w,py,r);x.closePath();}
function wrap(x,txt,cx,y,maxw,lh){const ch=txt.split('');let ln='',yy=y;for(let i=0;i<ch.length;i++){const t=ln+ch[i];if(x.measureText(t).width>maxw){x.fillText(ln,cx,yy);ln=ch[i];yy+=lh;}else ln=t;}x.fillText(ln,cx,yy);}

/* ---------- 读取分享链接 ---------- */
function loadFromHash(){
 const m=location.hash.match(/r=([A-Za-z0-9+/]+)/);
 if(!m)return false;
 try{
  const raw=atob(m[1]); if(raw.length!==QUESTIONS.length)return false;
  const a=[]; for(let i=0;i<raw.length;i++){const v=raw.charCodeAt(i)-48; if(v<0||v>3)return false; a.push(v);}
  ans=a; res=score(ans); cur=QUESTIONS.length; result(); return true;
 }catch(e){return false}
}

/* ---------- 启动 ---------- */
(function boot(){
 addEventListener('hashchange',()=>{ if(location.hash.indexOf('r=')===1){ if(!res) loadFromHash(); }});
 if(!loadFromHash()) lockScreen();
})();
</script>
